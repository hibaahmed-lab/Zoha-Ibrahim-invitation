<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoha & Ibrahim</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Allura&display=swap"
    rel="stylesheet"
  />

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://zoha-ibrahim.com/">
  <meta property="og:title" content="Zoha & Ibrahim">
  <meta property="og:description" content="Sangeet • Shendi • Walima | December 2026 – January 2027">
  <meta property="og:image" content="https://zoha-ibrahim.com/images/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Zoha & Ibrahim">
  <meta name="twitter:description" content="Sangeet • Shendi • Walima | December 2026 – January 2027">
  <meta name="twitter:image" content="https://zoha-ibrahim.com/images/preview.png">

  <link rel="canonical" href="https://zoha-ibrahim.com/">
</head>
<body>
  <main class="page" aria-label="Save the date envelope">
    <button
      type="button"
      class="envelope"
      id="envelope"
      aria-label="Open the envelope to reveal the save the date"
    >
      <!--
        Shared scene (780 × 2000). Stack (back → front):
          eback → openflap → paper-inside → pocket → closeflap → paper-front

        Both paper layers are absolutely positioned inside .invitation-scene
        (paper-inside via a same-size clip well). Identical inset/size so
        transform values stay aligned without layout measurement.
      -->
      <div class="invitation-scene" id="scene">
        <div class="envelope-artwork envelope-artwork--eback">
          <img
            class="layer layer--eback"
            src="images/eback.png"
            alt=""
            draggable="false"
          />
        </div>

        <div class="envelope-artwork envelope-artwork--openflap">
          <img
            class="layer layer--openflap"
            id="openflap"
            src="images/openflap.png"
            alt=""
            draggable="false"
          />
        </div>

        <!-- Same-size clip wrapper (inset:0). Does not change coordinate space. -->
        <div class="paper-well" aria-hidden="true">
          <img
            class="layer layer--paper paper-inside"
            id="paper-inside"
            src="images/paper2.png"
            alt=""
            draggable="false"
          />
        </div>

        <div class="envelope-artwork envelope-artwork--pocket">
          <img
            class="layer layer--pocket"
            src="images/pocket.png"
            alt=""
            draggable="false"
          />
        </div>

        <div class="envelope-artwork envelope-artwork--closeflap">
          <img
            class="layer layer--closeflap"
            id="closeflap"
            src="images/closeflap.png"
            alt=""
            draggable="false"
          />
        </div>

        <div class="layer paper-front-stack" id="paper-front-stack">
          <div class="paper-front-visual">
            <img
              class="paper-front-img"
              id="paper-front"
              src="images/paper2.png"
              alt="Save the Date — Zoha & Ibrahim"
              draggable="false"
            />

            <p class="paper-instruction">TAP AN EVENT TO VIEW THE INVITATION</p>
          </div>

          <!-- Percentage-positioned hotspots — adjust in CSS only -->
          <div class="event-hotspots" id="event-hotspots" aria-hidden="true">
            <div
              id="hotspot-shendi"
              class="event-hotspot event-hotspot--shendi"
              aria-label="Open Shendi invitation"
            ></div>
            <div
              id="hotspot-walima"
              class="event-hotspot event-hotspot--walima"
              aria-label="Open Walima invitation"
            ></div>
            <div
              id="hotspot-sangeet"
              class="event-hotspot event-hotspot--sangeet"
              aria-label="Open Sangeet invitation"
            ></div>
          </div>
        </div>
      </div>
      <div class="envelope-signature">Zoha &amp; Ibrahim</div>
      <p class="hint" id="hint">Tap the envelope to open</p>
    </button>
  </main>

  <div
    class="invitation-overlay"
    id="invitation-overlay"
    hidden
    aria-hidden="true"
  >
    <div class="invitation-overlay__backdrop" aria-hidden="true"></div>
    <div class="invitation-overlay__content">
      <button
        type="button"
        class="invitation-overlay__close"
        id="invitation-overlay-close"
        aria-label="Close invitation"
      >
        &times;
      </button>
      <div class="invitation-overlay__figure">
        <img
          class="invitation-overlay__image"
          id="invitation-overlay-image"
          src=""
          alt=""
          draggable="false"
        />
      </div>
    </div>
  </div>

  <!-- GSAP core -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
